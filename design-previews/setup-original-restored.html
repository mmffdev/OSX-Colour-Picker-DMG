<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const variants=[['Reference','Closest to your composition. Quiet, compact examples.'],['Folder map','Explains the workspace and catalogue as two distinct homes.'],['Live tree','Shows the structure responding to your choices.'],['Colour study','Uses palettes and typography to demonstrate the selected assets.'],['Setup proof','Keeps an evolving summary of what will be created.']];
const pages=['Welcome','Workspace','Catalogue','Clients','Projects','Assets','Review'];
const types=['Palettes','ICC Profiles','Fonts','Photographs','Images','ASE','Swatches','Colour Presets','LUTs','Video','Audio Clips','Colour Measurements','Typography','Documents','Catalogues & Collections','Application Presets'];
const state={variant:2,page:0,folder:'~/Documents/Colorgain',name:'Master Catalogue',singular:'Project',plural:'Projects',clientSingular:'Client',clientPlural:'Clients',assets:new Set(['Palettes','Typography','Photographs','ICC Profiles']),guides:false,returning:false,loaded:null,closed:false,created:false};
const swatches=['#e5d5bc','#85a2a5','#183e44','#aa3339','#f4be00','#242627'];
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arrow=`<svg class="arrow" viewBox="0 0 24 20" aria-hidden="true"><path d="M0 7h13L7 1h8l9 9-9 9H7l6-6H0z"/></svg>`;
const act=(label,fn,classes='')=>`<button class="action ${classes}" data-action="${fn}">${arrow}<span class="label">${label}</span></button>`;
const folderIcon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 7V5h8l2 3h10v13H2zM2 8h20"/></svg>`;
const docIcon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 2h9l5 5v15H5zM14 2v6h5"/></svg>`;
function palette(){return `<div class="palette" aria-label="Example palette">${swatches.map(c=>`<i style="background:${c}"></i>`).join('')}</div>`}
function tree(compact=false){
const mark=(text,active)=>active?`<span class="changing">[${esc(text)}]</span>`:esc(text);
const assets=types.filter(t=>state.assets.has(t));
const edit=(page,label)=>state.page===6?`<button class="tree-edit" data-jump="${page}" aria-label="Edit ${label}">Edit</button>`:'';
const leaves=()=>assets.map(t=>`<li class="file"><div class="tree-row">${folderIcon}${mark(t,state.page===5)}</div></li>`).join('');
return `${state.page===6?`<div class="workspace-edit">Workspace ${edit(1,'workspace')}</div>`:''}<div class="tree-pair"><section class="tree-scroll tree" aria-label="My Library tree" tabindex="0"><ul><li><div class="tree-row labelbar librarybar">${folderIcon}<strong>My Library</strong>${edit(5,'My Library assets')}</div><ul>${leaves()}</ul></li></ul></section><section class="tree-scroll tree" aria-label="Catalogue tree" tabindex="0"><ul><li><div class="tree-row labelbar">${folderIcon}<strong>${mark(state.name||'Master Catalogue',state.page===2)}</strong>${edit(2,'catalogue')}</div><ul><li><div class="tree-row">${folderIcon}${mark(state.clientSingular||'Client',state.page===3)}${edit(3,'client label')}</div><ul><li><div class="tree-row">${folderIcon}${mark(state.singular||'Project',state.page===4)}${edit(4,'project label')}</div><ul><li><div class="tree-row">${folderIcon}Assets${edit(5,'asset types')}</div><ul>${leaves()}</ul></li></ul></li></ul></li></ul></li></ul></section></div>`}
function proofRows(){return `<div class="ledger"><div class="ledger-row"><span>Workspace</span><strong>${esc(state.folder)}<br><span class="caption">Settings, My Library and catalogue list</span></strong></div><div class="ledger-row"><span>Catalogue</span><strong>${esc(state.name||'Master Catalogue')}</strong></div><div class="ledger-row"><span>Work items</span><strong>${esc(state.clientSingular)} → ${esc(state.plural||'Projects')} → Assets</strong></div><div class="ledger-row"><span>Shared categories</span><strong>${[...state.assets].map(esc).join(', ')||'None selected'}</strong></div></div>`}
function folderMap(){return `<div class="folder-map"><div class="folder-graphic yellow"></div><div><h3>Your workspace</h3><p>Settings and My Library stay with you as you switch catalogues.</p><div class="filehint">${esc(state.folder)}<br><span class="caption">colorgain.coldata</span></div></div></div><div class="folder-map"><div class="folder-graphic"></div><div><h3>${esc(state.name||'Master Catalogue')}</h3><p>Clients, their ${esc(state.plural.toLowerCase()||'projects')} and the assets used in that work.</p><div class="filehint">Catalogues / ${esc(state.name||'Master Catalogue')}<br><span class="caption">${esc(state.name||'Master Catalogue')}.colcat</span></div></div></div>`}
function right(){if(state.page===0&&!state.returning)return '';const p=state.page,v=state.variant;let content='',title='',foot='Examples only. No clients or sample assets are added during setup.';
if(v===0){if(p===0){content=`<div class="quiet-proof"><h3>One workspace. All your colour work.</h3>${palette()}<div class="colour-legend"><span>My Library</span><span>Available across catalogues</span></div></div>`;foot='Your workspace keeps My Library and your catalogue list together.'}else if(p===1){title='One home for your work';content=`<div class="paper-fold"><div><div class="folder-graphic yellow"></div><h3>My Library</h3><p>Your shared palettes and assets, available wherever you work.</p></div><div><div class="folder-graphic"></div><h3>Catalogues</h3><p>Your clients and their ${esc(state.plural.toLowerCase())}, organised separately.</p></div></div>`;foot='The workspace file remembers these locations.'}else if(p===4){title='An example of your structure';content=tree(true)}else if(p===5){title='The same categories, two places';content=`<div class="paper-fold"><div><h3>My Library</h3><p>${[...state.assets].map(esc).join('<br>')||'Choose your categories on the left.'}</p></div><div><h3>Inside each ${esc(state.singular.toLowerCase())}</h3><p>${[...state.assets].map(esc).join('<br>')||'Your choices appear here.'}</p></div></div>`;foot='You can add or remove categories later. Existing assets are kept.'}else{title='Ready for your own work';content=proofRows();foot='Your catalogue starts empty. Add clients or import a catalogue once inside the app.'}}
if(v===1){title=p===0?'Two homes, one workspace':p===1?'Where everything lives':p===4?'Catalogue ownership':p===5?'Shared or assigned':'What setup will create';content=folderMap();foot=p===5?'These category choices initialise both My Library and your first catalogue.':'A .coldata file opens a workspace. A .colcat belongs to a catalogue.'}
if(v===2){title=p===0?'Your workspace':p===1?'Your Workspace':p===2?'Your Catalogue':p===3?'Your Clients':p===4?'Your Projects':p===5?'Your Assets':'Your Workspace';content=tree(true);foot=''}
if(v===3){title=p===0?'A place for every colour decision':p===1?'Shared assets, ready for your work':p===4?'Example assets in a '+state.singular.toLowerCase():p===5?'A few things you can organise':'Start with the categories you need';content=`<div class="specimen-grid"><div class="specimen"><span class="spec-label">${state.assets.has('Typography')?'Typography / Example':'Colour / Example'}</span><span class="big">Ag<span style="color:#aa3339">.</span></span><div class="spec-colours">${swatches.slice(0,4).map(c=>`<i style="background:${c}"></i>`).join('')}</div></div><div class="mini-colours">${swatches.slice(1,5).map((c,i)=>`<i style="background:${c};color:${i===1||i===2?'#f8f7f4':'#111'}">${['Mist','Deep Teal','Oxblood','Yellow'][i]}</i>`).join('')}</div></div><p class="context-caption">${p===5?[...state.assets].map(esc).join(' · '):'Keep reusable assets in My Library. Assign work-specific assets to a client’s '+esc(state.singular.toLowerCase())+'.'}</p>`;foot='Illustrative palette and typography specimens. These are not installed.'}
if(v===4){title=p===0?'A simple setup, with room to grow':'Your setup, so far';content=proofRows();foot=p===0?'Choose a workspace, name a catalogue, then pick the asset categories you use.':'You can edit these choices before anything is created.'}
if(state.returning){title='Open a workspace';content=`<div class="folder-map"><div class="folder-graphic yellow"></div><div><h3>${state.loaded?esc(state.loaded):'Your existing .coldata file'}</h3><p>My Library, registered catalogues and saved settings belong to this workspace.</p></div></div><div class="ledger-row"><span>Catalogue import</span><span>Available inside the app through File → Import Catalogue or Catalogues +.</span></div>`;foot='This HTML prototype previews the choice; it does not open or modify your workspace.'}
return `<section class="right" aria-label="Example and preview"><div class="right-content"><h2 class="demo-title">${title}</h2>${content}<p class="demo-foot">${foot}</p></div></section>`}
function pageContent(){let heading='',description='',form='',actions='';
if(state.returning){heading='Welcome back';description='<p>Choose your existing <strong>.coldata</strong> file to return to your workspace. Your catalogues and My Library stay together.</p>';form=state.loaded?`<p class="path">${esc(state.loaded)}</p><p class="caption">Selected for this preview. The native app will check access and locate the registered catalogues.</p>`:act('Choose a Workspace…','pick');actions=act(state.loaded?'Open Workspace':'Choose a Workspace…',state.loaded?'opened':'pick')+act('Back to Welcome','welcome','minor');}
else if(state.page===0){heading='Welcome';description='<p>Thank you for choosing Colorgain, your colour proofing and digital asset manager.</p><p>Let’s set up your workspace. If you’re returning, choose your existing <strong>.coldata</strong> file and pick up where you left off.</p><p>Starting fresh? Create a workspace for My Library, your settings and your catalogue list.</p>';actions=act('Start a new Workspace','next')+act('Import a Workspace','returning')+act('Close','close','close');}
else if(state.page===1){heading='Your Workspace';description='<p>A workspace keeps your settings, My Library and catalogue list together. Choose an empty folder, or keep the suggested location.</p>';form=`<label class="field"><span>Workspace folder</span><input readonly id="folder" aria-label="Workspace folder" value="${esc(state.folder)}" spellcheck="false"></label>${act('Choose a Folder…','folder','minor')}`;actions=act('Continue','next')+act('Back','back','minor');}
else if(state.page===2){heading='Your first Catalogue';description='<p>A catalogue organises your work and its assets. Give your first catalogue a name; you can add more catalogues inside the app later.</p>';form=`<label class="field"><span>Catalogue name</span><input id="catalogue" aria-label="Catalogue name" value="${esc(state.name)}" spellcheck="false"></label>`;actions=act('Continue','next')+act('Back','back','minor');}
else if(state.page===3){heading='Who do you do work for?';description='<p>You’re setting up your initial schema: the structure used to organise your work. Choose what you call the people or organisations you work for.</p><p>You can create further bespoke schemas inside the app later.</p>';form=`<div class="choices" aria-label="Who you work for terminology">${['Client','Customer','Custom'].map(x=>`<button class="choice" data-client-term="${x}" aria-pressed="${x===(['Client','Customer'].includes(state.clientSingular)?state.clientSingular:'Custom')}">${x}</button>`).join('')}</div><div class="two-fields"><label class="field"><span>Name</span><input id="clientSingular" value="${esc(state.clientSingular)}" aria-label="Singular client or customer label"></label></div>`;actions=act('Continue','next')+act('Back','back','minor');}
else if(state.page===4){heading='Your Projects';description='<p>Choose how you categorise your work. Use Project, Product, Campaign, Work Order or a name of your own.</p>';form=`<div class="choices" aria-label="Work item terminology">${['Project','Product','Campaign','Work Order','Custom'].map(x=>`<button class="choice" data-term="${x}" aria-pressed="${x===(['Project','Product','Campaign','Work Order'].includes(state.singular)?state.singular:'Custom')}">${x}</button>`).join('')}</div><div class="two-fields"><label class="field"><span>Name</span><input id="singular" value="${esc(state.singular)}" aria-label="Singular work item name"></label></div>`;actions=act('Continue','next')+act('Back','back','minor');}
else if(state.page===5){heading='Your Asset Types';description='<p>Which assets do you work with? Your choices initialise both My Library and your first catalogue. Add or remove categories later.</p>';form=`<div class="asset-list">${types.map(t=>`<label class="asset-option"><input type="checkbox" data-type="${t}" ${state.assets.has(t)?'checked':''}>${t}</label>`).join('')}</div>`;actions=act('Review Setup','next')+act('Back','back','minor');}
else{heading='Thank you';description='<p>Your setup is ready. We’ll build your workspace, My Library and catalogue, then launch Colorgain.</p><p>Check your structure on the right. Use Edit beside a node to revisit a choice before continuing.</p>';form='';actions=act('Build and Launch','create')+act('Back','back','minor');}

return `<h1 class="heading">${!state.returning&&state.page>0?`<span class="step-prefix"><span class="step-number">${state.page}</span> <span class="step-of">of</span> <span class="step-number">${pages.length-1}</span></span> `:''}${heading}</h1><div class="description">${description}</div><div class="form">${form}<div class="feedback" role="status" id="error"></div></div><div class="actions ${state.page===0&&!state.returning?'welcome':''}">${actions}</div>`}
function render(){
$('#stage').classList.toggle('live-tree',state.variant===2);$('#stage').classList.toggle('asset-page',state.page===5);$('#stage').classList.toggle('client-page',state.page===3);
$('#variants').innerHTML=variants.map((v,i)=>`<button data-variant="${i}" aria-pressed="${state.variant===i}" title="${v[1]}">${i+1}. ${v[0]}</button>`).join('');
$('#pages').innerHTML=pages.map((p,i)=>`<button data-jump="${i}" aria-current="${i===state.page&&!state.returning?'step':'false'}">${p}</button>`).join('')+`<span class="note">${variants[state.variant][1]}</span>`;
let progress=state.variant===2?`<div class="progressline" style="width:${(state.page+1)/pages.length*100}%"></div>`:'';
let route=state.variant===1?`<nav class="route" aria-label="Setup route">${pages.map((p,i)=>`<button data-jump="${i}" class="${i===state.page?'active':i<state.page?'done':''}">${p}</button>`).join('')}</nav>`:'';
$('#screen').innerHTML=pageContent()+right()+route+progress;
if(state.closed||state.created){
const title=state.created?'Your workspace is ready.':'Setup preview closed.';
const copy=state.created?`<p>Your workspace, My Library and ${esc(state.name)} are ready for your work.</p><p>Add your first ${esc(state.clientSingular.toLowerCase())}, or bring in an existing catalogue using File → Import Catalogue or Catalogues +.</p><p>This is an HTML preview. No folders or catalogue files have been created.</p>`:'<p>Your preview choices are kept while this page remains open.</p>';
$('#screen').innerHTML=`<h1 class="heading">${title}</h1><div class="description">${copy}</div><div class="actions welcome">${act('Return to the preview','resume')}</div>`;
}

$('#guide').classList.toggle('on',state.guides);$('#guideToggle').textContent=state.guides?'Hide guides':'Show guides';$('#guideToggle').setAttribute('aria-pressed',state.guides);
}
function saveFields(){for(const [id,key]of [['clientSingular','clientSingular'],['clientPlural','clientPlural'],['folder','folder'],['catalogue','name'],['singular','singular'],['plural','plural']])if($('#'+id))state[key]=$('#'+id).value;}
function updatePreview(){const old=$('.right');if(old)old.outerHTML=right()}
function validate(){saveFields();let message='';if(state.page===3&&!state.clientSingular.trim())message='Enter a name.';if(state.page===3&&/[\\/]/.test(state.clientSingular+state.clientPlural))message='Labels cannot contain path separators.';if(state.page===1&&!state.folder.trim())message='Choose a folder for your workspace.';if(state.page===2&&!state.name.trim())message='Enter a catalogue name.';if(state.page===4&&!state.singular.trim())message='Enter a work item name.';if((state.page===2||state.page===4)&&/[\\/]/.test(state.name+state.singular))message='Names cannot contain path separators.';if(message){$('#error').textContent=message;return false}return true}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;saveFields();if(b.dataset.variant!==undefined){state.variant=Number(b.dataset.variant);render();return}if(b.dataset.jump!==undefined){state.page=Number(b.dataset.jump);state.returning=false;state.closed=false;state.created=false;render();return}if(b.dataset.clientTerm){if(b.dataset.clientTerm==='Custom'){state.clientSingular='';state.clientPlural=''}else{state.clientSingular=b.dataset.clientTerm;state.clientPlural=b.dataset.clientTerm+'s'}render();if(!state.clientSingular)$('#clientSingular').focus();return}if(b.dataset.term){if(b.dataset.term==='Custom'){state.singular='';state.plural=''}else{state.singular=b.dataset.term;state.plural=b.dataset.term+'s'}render();if(!state.singular)$('#singular').focus();return}switch(b.dataset.action){case'next':if(validate())state.page=Math.min(pages.length-1,state.page+1);break;case'back':state.page=Math.max(0,state.page-1);break;case'returning':state.returning=true;break;case'welcome':state.returning=false;state.page=0;break;case'pick':$('#filePicker').click();return;case'folder':$('#folder').focus();$('#folder').select();$('#error').textContent='Preview: type a folder path above. The app will use the macOS folder chooser.';return;case'close':state.closed=true;break;case'create':if(validate())state.created=true;break;case'opened':state.created=true;break;case'resume':state.closed=false;state.created=false;break;default:return}render();});
document.addEventListener('input',e=>{if(e.target.matches('.form input:not([type=checkbox])')){saveFields();updatePreview()}});
document.addEventListener('change',e=>{if(e.target.dataset.type){e.target.checked?state.assets.add(e.target.dataset.type):state.assets.delete(e.target.dataset.type);updatePreview()}});
$('#filePicker').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(!file.name.toLowerCase().endsWith('.coldata')){$('#error').textContent='Choose a .coldata workspace file.';return}state.loaded=file.name;render()});
$('#guideToggle').onclick=()=>{state.guides=!state.guides;render()};
const guidesX=[0,34,104,694,728,1336,1371,1439],guidesY=[0,51,64,143,184,288,354,527,575,651,833,874];
$('#guide').innerHTML=guidesX.map(x=>`<i class="v" style="left:${x}px"></i>`).join('')+guidesY.map(y=>`<i class="h" style="top:${y}px"></i>`).join('')+[[184,'Logo bottom'],[288,'Heading baseline'],[354,'Description top'],[527,'Action baseline'],[575,'Action baseline'],[651,'Close baseline']].map(([y,t])=>`<em style="top:${y}px">${t}</em>`).join('');
function fit(){const scale=Math.min(window.innerWidth/1440,window.innerHeight/875);$('#stage').style.transform=`scale(${scale})`;$('.viewport').style.height=875*scale+'px';$('.viewport').style.width=1440*scale+'px'}
window.addEventListener('resize',fit);render();fit();
</script><script>
function nativeMessage(action){saveFields();window.webkit.messageHandlers.setup.postMessage({action,draft:{page:state.page,name:state.name,singular:state.singular,clientSingular:state.clientSingular,assets:[...state.assets]}})}
window.restoreSetup=function(values){Object.assign(state,values);state.assets=new Set(values.assets);state.variant=2;state.closed=false;state.created=false;state.returning=false;render();fit()};
window.setupBusy=function(busy){document.querySelectorAll('button,input').forEach(e=>e.disabled=busy);const b=document.querySelector('[data-action="create"] .label');if(b)b.textContent=busy?'Building Workspace…':'Build and Launch'};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const action=b.dataset.action;
if(['folder','pick','returning','create','close'].includes(action)){e.preventDefault();e.stopImmediatePropagation();nativeMessage(({folder:'chooseFolder',pick:'openWorkspace',returning:'openWorkspace',create:'create',close:'close'})[action]);return}
if(state.fixedHome&&((action==='back'&&state.page===2)||b.dataset.jump==='1')){e.preventDefault();e.stopImmediatePropagation();return}
},true);
for(const event of ['click','input','change'])document.addEventListener(event,()=>{Promise.resolve().then(()=>nativeMessage('draft'))});
</script></body></html>
