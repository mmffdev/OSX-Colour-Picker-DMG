			shellScript = "# The shared Info.plist carries the direct download's Sparkle keys and an old minimum system;\n# the Store copy loses the first and takes the project's deployment target for the second.\n# The build number and commit are stamped as signing.sh does for the direct download.\nset -euo pipefail\nplist=\"$TARGET_BUILD_DIR/$INFOPLIST_PATH\"\nfor key in SUEnableAutomaticChecks SUFeedURL SUPublicEDKey SUScheduledCheckInterval; do\n    /usr/libexec/PlistBuddy -c \"Delete :$key\" \"$plist\" 2>/dev/null || true\ndone\n/usr/libexec/PlistBuddy -c \"Set :LSMinimumSystemVersion $MACOSX_DEPLOYMENT_TARGET\" \"$plist\"\ncd \"$SRCROOT\"\nif git rev-parse --git-dir >/dev/null 2>&1; then\n    build=\"$(git rev-list --count HEAD)\"\n    commit=\"$(git rev-parse --short HEAD)\"\n    if [ -n \"$(git status --porcelain --untracked-files=no -- '*.swift')\" ]; then commit=\"$commit+\"; fi\n    /usr/libexec/PlistBuddy -c \"Set :CFBundleVersion $build\" \"$plist\"\n    /usr/libexec/PlistBuddy -c \"Delete :ColourBuildCommit\" \"$plist\" 2>/dev/null || true\n    /usr/libexec/PlistBuddy -c \"Add :ColourBuildCommit string $commit\" \"$plist\"\nfi\n";
		};
