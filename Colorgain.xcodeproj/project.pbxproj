			shellScript = "# The input files put this phase after the property list and the binary are in place; without\n# them Xcode may process Info.plist after the stamp and lose it.\n# What build.sh does after compiling: the build number is the commit count, the commit is\n# stamped for the footer (a \"+\" when Swift files were uncommitted), and the Adobe helper and\n# its daemon plist go into the bundle. Xcode signs the whole bundle after this phase.\nset -euo pipefail\ncd \"$SRCROOT\"\napp=\"$TARGET_BUILD_DIR/$WRAPPER_NAME\"\nplist=\"$app/Contents/Info.plist\"\nif git rev-parse --git-dir >/dev/null 2>&1; then\n    build=\"$(git rev-list --count HEAD)\"\n    commit=\"$(git rev-parse --short HEAD)\"\n    if [ -n \"$(git status --porcelain --untracked-files=no -- '*.swift')\" ]; then commit=\"$commit+\"; fi\n    /usr/libexec/PlistBuddy -c \"Set :CFBundleVersion $build\" \"$plist\"\n    /usr/libexec/PlistBuddy -c \"Delete :ColourBuildCommit\" \"$plist\" 2>/dev/null || true\n    /usr/libexec/PlistBuddy -c \"Add :ColourBuildCommit string $commit\" \"$plist\"\nfi\nhelper=\"$app/Contents/MacOS/MMFFDevColour3Helper\"\nid=\"com.mmffdev.mmffdevcolour3.helper\"\nif [ ! -f \"$helper\" ] || [ helper/main.swift -nt \"$helper\" ] || [ AdobeHelperRules.swift -nt \"$helper\" ]; then\n    xcrun swiftc -O helper/main.swift AdobeHelperRules.swift -o \"$helper\"\nfi\nmkdir -p \"$app/Contents/Library/LaunchDaemons\"\ncp \"helper/$id.plist\" \"$app/Contents/Library/LaunchDaemons/$id.plist\"\nif [ -n \"${EXPANDED_CODE_SIGN_IDENTITY:-}\" ] && [ \"$EXPANDED_CODE_SIGN_IDENTITY\" != \"-\" ]; then\n    codesign --force --options runtime --timestamp --identifier \"$id\" --sign \"$EXPANDED_CODE_SIGN_IDENTITY\" \"$helper\"\nelse\n    codesign --force --identifier \"$id\" --sign - \"$helper\"\nfi\n";
		};
