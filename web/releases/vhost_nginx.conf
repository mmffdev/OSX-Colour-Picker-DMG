# /var/www/vhosts/system/releases.colorgain.com/conf/vhost_nginx.conf - Plesk nginx in front of Forgejo.
# The root goes to the app's releases page; /appcast.xml is a static file we own (the Sparkle feed), never Forgejo's.
location = / {
    return 302 /colorgain/colorgain/releases;
}
location = /appcast.xml {
    root /var/www/vhosts/colorgain.com/releases.colorgain.com;
    default_type application/rss+xml;
    add_header Cache-Control "no-cache";
}
location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_max_body_size 1024m;
}
