## releases.colorgain.com: Forgejo and its Postgres, at /var/forgejo on the Plesk box.
## Plesk nginx terminates TLS and proxies to 127.0.0.1:3001 (vhost_nginx.conf). Secrets come from /var/forgejo/.env.
## The Sparkle feed is NOT served by Forgejo: it is the static file /appcast.xml on the subdomain's docroot (see vhost_nginx.conf).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: forgejo
      POSTGRES_USER: forgejo
      POSTGRES_PASSWORD: ${FORGEJO_DB_PASSWORD}
    volumes:
      - /var/forgejo/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgejo"]
      interval: 10s
      timeout: 5s
      retries: 10

  forgejo:
    image: codeberg.org/forgejo/forgejo:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      USER_UID: 1000
      USER_GID: 1000
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: db:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: ${FORGEJO_DB_PASSWORD}
      FORGEJO__server__DOMAIN: releases.colorgain.com
      FORGEJO__server__ROOT_URL: https://releases.colorgain.com/
      FORGEJO__server__HTTP_PORT: 3000
      FORGEJO__server__SSH_DOMAIN: releases.colorgain.com
      FORGEJO__server__SSH_PORT: 2222
      FORGEJO__server__LANDING_PAGE: explore
      FORGEJO__server__OFFLINE_MODE: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "false"
      FORGEJO__service__ENABLE_NOTIFY_MAIL: "true"
      FORGEJO__repository__DEFAULT_PRIVATE: last
      FORGEJO__attachment__MAX_SIZE: 1024
      FORGEJO__attachment__ALLOWED_TYPES: "*/*"
      FORGEJO__actions__ENABLED: "false"
      FORGEJO__mailer__ENABLED: "true"
      FORGEJO__mailer__PROTOCOL: smtps
      FORGEJO__mailer__SMTP_ADDR: mmffdev.com
      FORGEJO__mailer__SMTP_PORT: 465
      FORGEJO__mailer__FROM: "Colorgain Releases <releases@colorgain.com>"
      FORGEJO__mailer__USER: releases@colorgain.com
      FORGEJO__mailer__PASSWD: ${FORGEJO_SMTP_PASSWORD}
    ports:
      - "127.0.0.1:3001:3000"
      - "2222:22"
    volumes:
      - /var/forgejo/data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
